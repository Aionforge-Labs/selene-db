# Release gate for selene-db — runs on PRs into `main` (i.e. `development` → `main`).
#
# Workflow model (2026-05-28): everyday Brief work merges into `development`
# behind the routine `ci.yml` gate + local hooks. A release batches `development`
# into a single PR against `main`; THIS workflow is the comprehensive pre-merge
# gate that runs everything the fast gate skipped — full build, lint, tests,
# doctests, macOS validation, dependency audit, and a parser fuzz pass.
#
# Releases are infrequent, so the macOS 10x billing multiplier and the fuzz
# minutes are paid here, off the per-Brief critical path.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/concurrency:/with:).

name: release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags:
      - 'v2.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release-policy:
    name: release tag policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/check-release-tag.test.sh

  conformance-claim:
    name: ISO-aligned conformance claim
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2.'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: verify ISO-aligned claim at exact revision
        run: bash scripts/check-conformance-claim.sh "$EXPECTED_REVISION" iso_aligned

  fmt:
    name: fmt
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  repository-home:
    name: repository-home metadata
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/check-repository-home.sh .

  v2-plan-contract:
    name: 2.0 plan contract
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: python3 -B .github/scripts/check-v2-plan.py --root .
      - run: python3 -B .github/scripts/check-v2-plan.test.py

  clippy:
    name: clippy (${{ matrix.os }})
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Strip DWARF from the test build graph to keep ubuntu `ld` under the
      # runner mmap cap (SIGBUS otherwise). See ci-spend-triage / BRIEF-131c.
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
          fallback: none
      - name: cargo nextest + doctests
        run: |
          cargo nextest run --workspace --locked --all-features --profile ci
          cargo test --workspace --locked --all-features --doc

  deny:
    name: cargo-deny
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --exclude-dev
          command: check bans
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  audit:
    name: cargo-audit
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: advisory-db-${{ runner.os }}-
      - run: cargo audit --color always

  thirdparty-current:
    name: third-party attribution current
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: bash .github/scripts/check-thirdparty-current.sh

  file-size-cap:
    name: file-size cap (700 LOC)
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/check-no-secrets.sh

  bench-invocation-lint:
    name: bench invocation lint
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/check-bench-invocation.sh .
      - run: bash .github/scripts/check-bench-invocation.test.sh
      - run: bash .github/scripts/check-mimalloc-dev-dep.sh .
      - run: bash .github/scripts/check-mimalloc-dev-dep.test.sh
      - run: bash scripts/run-benches.test.sh

  parse-fuzz:
    name: parse-fuzz (5m release pass)
    # Linux-only: cargo-fuzz/libFuzzer requires a Linux target triple.
    # 5-minute pre-release pass; the 15-minute deeper soak stays on nightly.yml.
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v6
        with:
          path: crates/selene-gql/fuzz/corpus
          key: gql-fuzz-corpus-${{ runner.os }}-${{ hashFiles('crates/selene-testing/corpus/positive/**/*.gql') }}
          restore-keys: gql-fuzz-corpus-${{ runner.os }}-
      - name: seed parse corpus
        run: |
          mkdir -p crates/selene-gql/fuzz/corpus/parse_gql
          find crates/selene-testing/corpus/positive -name '*.gql' -exec cp {} crates/selene-gql/fuzz/corpus/parse_gql/ \;
      - name: fuzz parser (5m)
        working-directory: crates/selene-gql/fuzz
        # -timeout=20 caps per-input parse time at 20s. The default (1200s)
        # silently tolerated the super-linear bracket-backtracking blow-up; a
        # 20s ceiling makes any future regression fail the gate. No legitimate
        # input parses anywhere near this long.
        # -max_len=65536 lifts libFuzzer's 4096-byte default so the soak can
        # reach the zero-delimiter deep-recursion crash thresholds (a sign/NOT
        # chain only crashes in the thousands-to-tens-of-thousands of bytes); the
        # default could never generate an input long enough to trip them.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse_gql -- -max_total_time=300 -timeout=20 -max_len=65536

  persist-decode-fuzz:
    name: persist-decode-fuzz (short smoke)
    # Linux-only: cargo-fuzz/libFuzzer requires a Linux target triple.
    # One job runs the four crash-recovery decoder targets sequentially; a 4-way
    # matrix would re-pay the cargo-fuzz install + cold selene-persist compile
    # four times. The budget is deliberately short (20s/target): these are small,
    # linear, fixed-layout decoders with no deep state space (unlike the parser's
    # super-linear backtracking, which earns the 5m/1h budgets), and the known
    # bound/panic edges already have dedicated regression tests in the normal
    # test suite. This pass is a fast pre-release sanity smoke, not a deep soak.
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Cache the evolving corpus libFuzzer accretes across runs (no committed
      # seed files; the key is content-addressed on the target sources).
      - uses: actions/cache@v6
        with:
          path: crates/selene-persist/fuzz/corpus
          key: persist-fuzz-corpus-${{ runner.os }}-${{ hashFiles('crates/selene-persist/fuzz/fuzz_targets/**') }}
          restore-keys: persist-fuzz-corpus-${{ runner.os }}-
      - name: fuzz decoders (5 x 20s)
        working-directory: crates/selene-persist/fuzz
        # Invariant: arbitrary bytes -> Ok or typed PersistError, never
        # panic/OOM/hang. -timeout=20 fails any input that hangs; -max_len=65536
        # bounds the audit record count and the manifest/section length fields.
        run: |
          for target in decode_control decode_manifest decode_wal decode_audit decode_snapshot; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=20 -timeout=20 -max_len=65536
          done

  publish-crates:
    name: publish crates.io
    needs: [release-policy, conformance-claim]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2.') && github.repository == 'jscott3201/selene-db'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: publish public crates
        run: |
          set -euo pipefail

          workspace_version="$(awk -F' = ' '
            $0 == "[workspace.package]" { in_workspace = 1; next }
            /^\[/ && in_workspace { exit }
            in_workspace && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' Cargo.toml)"
          bash .github/scripts/check-release-tag.sh "$GITHUB_REF_NAME" "$workspace_version"
          version="${GITHUB_REF_NAME#v}"

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for crates.io publishing." >&2
            exit 1
          fi

          crate_published() {
            crate="$1"
            crate_version="$2"
            curl --fail --silent --output /dev/null \
              --header "User-Agent: selene-db-release-workflow (github.com/jscott3201/selene-db)" \
              "https://crates.io/api/v1/crates/${crate}/${crate_version}"
          }

          wait_for_index() {
            crate="$1"
            crate_version="$2"
            for attempt in $(seq 1 60); do
              if crate_published "$crate" "$crate_version"; then
                echo "${crate} ${crate_version} is visible in crates.io."
                return 0
              fi
              echo "Waiting for ${crate} ${crate_version} to index (${attempt}/60)..."
              sleep 10
            done
            echo "${crate} ${crate_version} did not become visible in crates.io in time." >&2
            return 1
          }

          publish_crate() {
            crate="$1"
            if crate_published "$crate" "$version"; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi
            cargo publish -p "$crate" --locked
            wait_for_index "$crate" "$version"
          }

          publish_crate selene-db-core
          publish_crate selene-db-persist
          publish_crate selene-db-graph
          publish_crate selene-db-algorithms
          publish_crate selene-db-gql

  github-release:
    name: GitHub release
    needs: publish-crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2.') && github.repository == 'jscott3201/selene-db'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: create or update release
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            printf 'Published selene-db %s.\n' "$TAG_NAME" > "$notes_file"
          fi

          title="selene-db ${TAG_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --target "$TARGET_SHA" \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --target "$TARGET_SHA" \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest
          fi
