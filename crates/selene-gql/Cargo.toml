[package]
name = "selene-db-gql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ISO/IEC 39075:2024 GQL parser, planner, optimizer, and executor for selene-db."
autobenches = false

[lib]
name = "selene_gql"

[dependencies]
selene-catalog.workspace = true
selene-core = { package = "selene-db-core", path = "../selene-core", version = "2.0.0-alpha.1" }
selene-graph = { package = "selene-db-graph", path = "../selene-graph", version = "2.0.0-alpha.1" }
selene-algorithms = { package = "selene-db-algorithms", path = "../selene-algorithms", version = "2.0.0-alpha.1" }
selene-profile.workspace = true
jiff.workspace = true
miette.workspace = true
parking_lot.workspace = true
pest.workspace = true
pest_derive.workspace = true
rust_decimal.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
lru.workspace = true
stacker.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true

[features]
metrics = ["selene-core/metrics"]
test-harness = []
plan-cache-source-tracing = []

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
mimalloc.workspace = true
metrics.workspace = true
parking_lot.workspace = true
proptest.workspace = true
rstest.workspace = true
rust_decimal.workspace = true
semver.workspace = true
selene-persist = { package = "selene-db-persist", path = "../selene-persist", version = "2.0.0-alpha.1" }
selene-testing = { package = "selene-db-testing", path = "../selene-testing" }
serde_json.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "cost_estimators"
required-features = ["test-harness"]

[[test]]
name = "plan_snapshot_corpus"
required-features = ["test-harness"]

[[test]]
name = "executor_snapshot_corpus"
required-features = ["test-harness"]

[[test]]
name = "evaluator_completeness"
required-features = ["test-harness"]

[[test]]
name = "parameter_aware_scan"
required-features = ["test-harness"]

[[test]]
name = "metrics_emit_under_feature"
required-features = ["metrics"]

[[bench]]
name = "parse"
harness = false
required-features = ["test-harness"]

[[bench]]
name = "analyze"
harness = false
required-features = ["test-harness"]

[[bench]]
name = "plan_optimize"
harness = false
required-features = ["test-harness"]

[[bench]]
name = "mixed_orientation"
harness = false
required-features = ["test-harness"]

[[bench]]
name = "write_e2e"
harness = false
required-features = ["test-harness"]

[[bench]]
name = "expression_eval"
harness = false

[[bench]]
name = "procedure_call_repeat"
harness = false

[[bench]]
name = "correlated_subquery"
harness = false

[[bench]]
name = "read_pipeline"
harness = false

[[bench]]
name = "execution_context"
harness = false

[[bench]]
name = "bounded_paths"
harness = false

[lints]
workspace = true
