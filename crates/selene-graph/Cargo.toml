[package]
name = "selene-db-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-memory property-graph storage core (ArcSwap + persistent CoW, label/typed indexes, write funnel) for selene-db."
autobenches = false

[lib]
name = "selene_graph"

[dependencies]
selene-catalog.workspace = true
selene-core = { package = "selene-db-core", path = "../selene-core", version = "2.0.0-alpha.1" }
selene-persist.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
immutable-chunkmap.workspace = true
rustc-hash.workspace = true
jiff.workspace = true
roaring.workspace = true
rayon.workspace = true
smallvec.workspace = true
triomphe.workspace = true
serde.workspace = true
# use-std declared here (not inherited via unification with selene-persist)
# because candidate_state.rs and core_provider/sections/codec.rs call
# postcard::to_stdvec; a standalone `cargo check -p selene-db-graph` must build.
postcard = { workspace = true, features = ["use-std"] }
rkyv.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
miette.workspace = true
tracing.workspace = true
uuid.workspace = true
wide.workspace = true

[features]
metrics = ["selene-core/metrics"]

[dev-dependencies]
blake3.workspace = true
criterion.workspace = true
mimalloc.workspace = true
proptest.workspace = true
rstest.workspace = true
selene-testing = { package = "selene-db-testing", path = "../selene-testing" }
# Keep WAL/snapshot recovery covered under consumer feature unification.
serde_json = { workspace = true, features = ["arbitrary_precision"] }

