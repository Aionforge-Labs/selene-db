# selene-db workspace root.
#
# Workspace members are added as their owning 2.0 work items land.
#
# Workspace-level configuration (lints, profile, deps version pins) lives
# here so each member crate inherits the floor without re-declaring.

[workspace]
resolver = "3"
members = [
    "crates/selene-profile",
    "crates/selene-core",
    "crates/selene-graph",
    "crates/selene-persist",
    "crates/selene-gql",
    "crates/selene-algorithms",
    "crates/selene-catalog",
    "crates/selene-db",
    "crates/selene-testing",
]
exclude = ["_spec", "crates/selene-gql/fuzz", "crates/selene-persist/fuzz"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["selene-db contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jscott3201/selene-db"
homepage = "https://github.com/jscott3201/selene-db"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(selene_bench_system_alloc)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"

# Workspace-level dependency versions go here as crates are added. Keeping
# them centralized means a single line bumps the version everywhere.
[workspace.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
thiserror = "2.0.20"
miette = { version = "7.6.0", features = ["derive"] }
pest = "2.9.0"
pest_derive = "2.9.0"
jiff = { version = "0.2.35", features = ["serde"] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.24.1", features = ["v4", "v7", "serde"] }
unicode-normalization = "0.1.25"
unicode-ident = "1.0.24"
smallvec = { version = "1.15.2", features = ["const_generics", "serde", "union"] }
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
# pointer_width_64 pins archived relative-pointer width to 64 bits; v1.0
# ships only x86_64 / aarch64 targets, so this is intentional. unaligned
# lets rkyv decode archives from byte buffers (Vec<u8>) without requiring
# 8-byte alignment; section bytes come back from the snapshot reader as
# plain Vec<u8> with only 1-byte alignment guarantees by type.
rkyv = { version = "0.8.18", default-features = false, features = ["alloc", "bytecheck", "pointer_width_64", "unaligned"] }
arc-swap = "1.9.2"
fastrand = "2.5.0"
parking_lot = "0.12.5"
rayon = "1.12.0"
immutable-chunkmap = { version = "2.1.3", default-features = false }
rustc-hash = "2.1.3"
roaring = "0.11.5"
triomphe = "0.1.16"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
metrics = "0.24.6"
lru = "0.18.2"
blake3 = "1.8.6"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zstd = "0.13.3"
semver = "1.0.28"
serde_json = "1.0.151"
# Safe SIMD lane types for vector metric kernels.
wide = "1.6.1"
# Runtime stack-growth shim. Used by the GQL analyzer to bound recursive
# `bind_value_expr` against the OS default thread stack (2 MB on macOS);
# matches the rustc / syn / serde recursion pattern.
stacker = "0.1.25"
selene-persist = { package = "selene-db-persist", path = "crates/selene-persist", version = "2.0.0-alpha.1" }
selene-profile = { package = "selene-db-profile", path = "crates/selene-profile", version = "2.0.0-alpha.1" }
selene-catalog = { package = "selene-db-catalog", path = "crates/selene-catalog", version = "2.0.0-alpha.1" }

# Dev dependencies.
criterion = "0.8.2"
# Bench-binary global allocator. Library crates do NOT depend on this;
# embedders pick their own allocator.
mimalloc = { version = "0.1.52", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rstest = "0.26.1"
insta = "1.48.0"
# default-features = false drops postcard's default heapless-cas feature, the
# only path pulling heapless 0.7 -> atomic-polyfill (unmaintained,
# RUSTSEC-2023-0089) + spin. Crates that call to_stdvec declare use-std on
# their own dependency line instead of riding feature unification.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
tempfile = "3.27.0"
pollster = "1.0.1"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.dev]
# Line tables only — backtraces stay resolvable, full DWARF dropped.
# Per CI's CARGO_PROFILE_TEST_DEBUG=0 posture, with the small concession
# that dev builds keep line numbers for ergonomic panic reports.
debug = "line-tables-only"
incremental = true
